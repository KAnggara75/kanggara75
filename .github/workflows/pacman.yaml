name: Generate pacman animation

on:
  schedule:
    # Execute every 12 hours at minute 30 (00:30 & 12:30 UTC) to avoid collision with snake
    - cron: "30 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Prevent concurrent runs from colliding on output branch push/lock
concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
